# Investor rules & weights. Hot-editable: the pipeline and UI reload this file,
# so tuning the strategy never requires a code change or redeploy.

search:
  municipality: Cholargos   # anchor area (XE geo_place_id); scraped first
  # Municipalities on the MODERN metro (Lines 2 & 3) — the Line 1 / ISAP electric
  # railway suburbs (Kifisia, Marousi, Nea Ionia) are deliberately excluded, since the
  # thesis wants genuine metro proximity. The per-listing metro-distance filter is the
  # real gate (station coords for both lines live in enrich.py); these are the areas
  # where listings can actually pass it.
  areas:
    # Line 3 (blue) — north-east corridor
    - Papagou
    - Agia Paraskevi
    - Chalandri
    - Zografou
    - Vrilissia
    # Line 2 (red) — southern corridor
    - Ilioupoli
    - Agios Dimitrios
    - Dafni
    - Alimos
    - Argyroupoli
    - Elliniko
    - Nea Smyrni
  neighborhoods: [Faneromeni, Ano Cholargos, Plateia Dimokratias, Lofos Tsakou]
  est_rent_eur_per_m2: 11.0   # baseline monthly rent estimate for gross-yield scoring
  price_min: 120000
  price_max: 320000
  area_min_m2: 45

hard_filters:
  min_floor: 1               # exclude ground/semi-basement/mezzanine (floor <= 0)
  max_metro_distance_m: 600

weights:                     # contribution to the 0-100 score (quality-first)
  newness: 20                # build/renovation year — favour new/renovated stock
  gross_yield: 22            # realistic rental income from real rent comps
  energy_class: 18           # A/B efficient & future-proof vs Ε/Ζ/Η liability
  undervaluation: 16         # priced below hedonic fair value (secondary to quality)
  price_drop: 8              # dropped since first_seen
  is_currently_rented: 8     # proven rent (ground-truth comp)
  is_private_seller: 8       # negotiation room

opportunity_flag:
  price_per_m2_below_median_pct: 0.85

# Reference points for signal normalization (transparent heuristic, not ML).
scoring_reference:
  yield_floor: 0.02          # 2% gross -> signal 0
  yield_ceiling: 0.08        # 8% gross -> signal 1
  max_price_drop_pct: 0.20   # a 20% drop saturates the price_drop signal
  build_year_floor: 1980     # built in/before 1980 -> newness 0
  build_year_ceiling: 2015   # built in/after 2015 -> newness 1
  target_undervaluation: 0.20  # priced 20% below fair value -> undervaluation signal 1
  energy_liability_floor: 0.55 # worst energy class (G/Η) keeps 55% of score (EU-EPBD risk)
