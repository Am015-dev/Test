services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - holargos-data:/app/data
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      # Read-write: the Strategy page saves edits back to this file (live re-score).
      - ./strategy.yaml:/app/strategy.yaml
    env_file:
      - .env

  # Scale-up storage (opt-in). Start with:  docker compose --profile postgres up -d
  # then set DATABASE_URL=postgresql+psycopg://holargos:holargos@db:5432/holargos
  # in .env (and `pip install "psycopg[binary]"` is bundled via the postgres extra).
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: holargos
      POSTGRES_PASSWORD: holargos
      POSTGRES_DB: holargos
    volumes:
      - holargos-pgdata:/var/lib/postgresql/data

volumes:
  holargos-data:
  holargos-pgdata:
