services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - holargos-data:/app/data
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      # Read-write: the Strategy page saves edits back to this file (live re-score).
      - ./strategy.yaml:/app/strategy.yaml
    env_file:
      - .env

volumes:
  holargos-data:
