services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    volumes:
      - holargos-data:/app/data
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      # Read-write: the Strategy page saves edits back to this file (live re-score).
      - ./strategy.yaml:/app/strategy.yaml
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # Shared storage — Postgres on the control VM. This is what lets multiple scraper
  # workers (added later, each on its own Oracle IP) write to one database.
  # .env sets: DATABASE_URL=postgresql+psycopg://holargos:holargos@db:5432/holargos
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: holargos
      POSTGRES_PASSWORD: holargos
      POSTGRES_DB: holargos
    volumes:
      - holargos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holargos"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Scale-out worker (opt-in) for ADDITIONAL Oracle instances — each on its own
  # public IP. Point DATABASE_URL at the control VM's Postgres and run:
  #   docker compose run --rm worker            # drain the queue once
  #   docker compose --profile worker up -d     # keep polling (continuous)
  worker:
    build: .
    profiles: ["worker"]
    restart: unless-stopped
    command: ["python", "scripts/worker.py", "--poll", "300"]
    volumes:
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./strategy.yaml:/app/strategy.yaml
    env_file:
      - .env

volumes:
  holargos-data:
  holargos-pgdata:
