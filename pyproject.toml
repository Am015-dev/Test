[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holargos-scout"
version = "0.1.0"
description = "Daily real-estate investment assistant for the Holargos / Athens market"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Holargos Scout" }]
dependencies = [
    "selectolax>=0.3.21",
    "SQLAlchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "geopy>=2.4",
    "PyYAML>=6.0",
    "requests>=2.31",
    "streamlit>=1.50",
    "Authlib>=1.3.2",  # st.login() (Google sign-in, docs/ACCOUNTS.md)
    "pydeck>=0.8",
    "pandas>=2.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1.9",
    "black>=23.12",
]
schedule = [
    "APScheduler>=3.10",
]
postgres = [
    "psycopg[binary]>=3.1",
]
# Optional: only needed for the WAF-blocked portals via a real browser.
browser = [
    "playwright>=1.40",
]

[project.scripts]
holargos-run-daily = "scout.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scout = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
