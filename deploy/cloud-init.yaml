#cloud-config
# Holargos Property Scout — fully automated first-boot setup for Oracle Cloud.
#
# ┌─ BEFORE YOU PASTE THIS ───────────────────────────────────────────────────┐
# │ The repo is PRIVATE, so the clone below needs a GitHub token.              │
# │ 1. Create a read-only Personal Access Token:                              │
# │    - Classic:  github.com/settings/tokens → Generate (classic) →          │
# │                tick the `repo` scope.                                      │
# │    - Fine-grained: github.com/settings/tokens?type=beta → only repo       │
# │                Am015-dev/Test → Repository permissions → Contents: Read.   │
# │ 2. Replace the text __GITHUB_TOKEN__ below with that token.               │
# └───────────────────────────────────────────────────────────────────────────┘
#
# Paste the entire (edited) contents of this file into the OCI instance form:
#   Advanced options → Management → "Paste cloud-init script"
#
# On first boot (as root) this installs Docker, clones the repo, builds the
# image (Playwright + Chromium), starts Streamlit on port 8501, opens the
# firewall, and installs the daily-scrape cron. No SSH required.
#
# After ~5-10 min (image build) open:  http://<PUBLIC_IP>:8501
package_update: true
packages:
  - git
  - iptables-persistent

runcmd:
  # Install Docker engine + compose v2 plugin.
  - curl -fsSL https://get.docker.com | sh
  # Fetch the app (private repo → token in the URL; replace __GITHUB_TOKEN__).
  # The token persists in /opt/holargos/.git/config so future `git pull` works too.
  - git clone https://__GITHUB_TOKEN__@github.com/Am015-dev/Test.git /opt/holargos
  # Converge runtime config: create .env (defaults work out of the box) + install all
  # cron jobs (auto-update, daily scrape, healthcheck). One source of truth, also run
  # on every auto-update tick so existing instances stay current without re-provision.
  - bash /opt/holargos/deploy/reconcile.sh
  # Build image and start the stack (honours COMPOSE_PROFILES from .env).
  - bash -c 'cd /opt/holargos && docker compose up -d --build'
  # Open ports (OCI Ubuntu images ship a default REJECT in INPUT). 8501 = direct
  # Streamlit; 80/443 = the optional Caddy reverse proxy (free HTTPS custom domain).
  # NOTE: you must ALSO allow these in the OCI console (VCN Security List / NSG).
  - iptables -I INPUT -p tcp --dport 8501 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save || true

final_message: "Holargos Property Scout setup finished after $UPTIME seconds. Streamlit is on port 8501."
