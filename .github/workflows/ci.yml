name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: black --check src/ tests/ scripts/
