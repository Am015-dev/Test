name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref, so stale
# runs don't pile up or waste minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Tests (deterministic unit + integration suite)
        run: python -m pytest -q --ignore=tests/test_ui_smoke.py

      - name: UI smoke (Streamlit AppTest — retried)
        # These boot the full Streamlit runtime and round-trip a DataFrame through
        # Arrow; pyarrow can occasionally segfault natively on the CI runner (exit
        # 139), which is environmental, not a code regression. Retry up to 3× so a
        # transient native crash doesn't flake the gate — a real UI break fails all
        # three attempts and still blocks.
        run: |
          for attempt in 1 2 3; do
            python -m pytest tests/test_ui_smoke.py -q && exit 0
            echo "::warning::UI smoke attempt $attempt failed (possible pyarrow native segfault); retrying"
          done
          exit 1

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: black --check src/ tests/ scripts/

      - name: Readiness smoke (schema + doctor)
        run: |
          python -c "from scout.db import init_db; init_db()"
          python scripts/doctor.py
