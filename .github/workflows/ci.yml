name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel an in-progress run when a newer commit is pushed to the same ref, so stale
# runs don't pile up or waste minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Format check
        run: black --check src/ tests/ scripts/

      - name: Readiness smoke (schema + doctor)
        run: |
          python -c "from scout.db import init_db; init_db()"
          python scripts/doctor.py
