# CI gate — kept deliberately cheap so it fits inside the free Actions budget
# (private repos get 2000 min/month). The old config ran on EVERY push to EVERY
# branch plus every PR plus the daily bot's data commits — the main reason the
# budget was exhausted. Now:
#   - runs on PRs to main (the review gate) and pushes to main only — not on
#     every feature-branch push (the local gate covers those before a PR);
#   - skips data-only / docs-only commits (the daily-refresh bot only touches
#     data/listings.db — nothing to test), so those never spend minutes;
#   - cancels superseded runs, and caches pip so each run is shorter.
name: CI
on:
  pull_request:
    paths-ignore: ["data/**", "docs/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["data/**", "docs/**", "**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -e .
          pip install pytest ruff black
      - name: Ruff
        run: ruff check src/ tests/ scripts/
      - name: Black
        run: black --check src/ tests/ scripts/
      - name: Tests
        run: python -m pytest -q
