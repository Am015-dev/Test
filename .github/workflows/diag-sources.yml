# Diagnostic only: survey Greek portals and smoke-test the plain-HTTP collectors from a
# GitHub runner (the dev sandbox is blocked). Runs on push to ws/sources or by hand; prints to
# the job log and writes only to a throwaway SQLite file — never to the `data` branch.
name: diag-sources
on:
  push:
    branches: [ws/sources, ws/sources-remax]
    paths:
      - diag/**
      - scripts/smoke_sources.py
      - src/scout/collectors/**
      - src/scout/pipeline.py
      - .github/workflows/diag-sources.yml
  workflow_dispatch:
    inputs:
      area:
        description: "Area for the collector smoke run"
        default: "Cholargos"
      sources:
        description: "SOURCES for the smoke run"
        default: "xe,goldenhome"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -q
      - name: RE/MAX sale-search probe
        run: python diag/remax_probe.py
