# Diagnostic only: survey Greek portals from a GitHub runner (the dev sandbox is blocked).
# Runs on push to ws/sources or by hand; prints to the job log. Never writes to the DB branch.
name: diag-sources
on:
  push:
    branches: [ws/sources]
    paths: [diag/**, .github/workflows/diag-sources.yml, src/scout/collectors/**]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -q
      - name: Survey portals (search pages)
        run: >-
          python diag/sources_probe.py --no-home --only remax,goldenhome,era
          --grep 'xolarg|cholarg|poliseis-katoikies|pwlisi/katoikies|/property/\d|akinit|ajax'
          --dump remax,goldenhome
          --url remax=https://www.remax.gr/poliseis-katoikies/101-athhna-boreia-proastia
          --url goldenhome=https://goldenhome.gr/property/pwlisi/perioxi-athens-northern-suburbs
          --url era=https://era.gr/wp-sitemap.xml
          --url era=https://era.gr/akinita/
