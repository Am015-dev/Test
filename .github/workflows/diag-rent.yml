# Diagnostic only: capture a real XE rental search page for tests/fixtures (the dev sandbox
# cannot reach XE). Prints to the job log; writes nothing anywhere.
name: diag-rent
on:
  push:
    branches: [ws/rent-data]
    paths:
      - diag/xe_rent_probe.py
      - .github/workflows/diag-rent.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -q
      - name: Capture XE rental cards (Cholargos)
        env:
          SCRAPE_REQUEST_MIN_S: "4"
          SCRAPE_REQUEST_MAX_S: "7"
        run: python diag/xe_rent_probe.py Cholargos
