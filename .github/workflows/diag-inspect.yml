name: diag-inspect
on:
  push:
    branches: [diag/inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -q
      - run: python diag/fetch_pages.py
        env:
          SCRAPE_REQUEST_MIN_S: "3"
          SCRAPE_REQUEST_MAX_S: "5"
