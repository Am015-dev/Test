# Weekly data refresh — everything lives in GitHub, no external database.
#
# The listings DB (SQLite) is stored as ONE file on an orphan `data` branch that is
# force-pushed as a single commit each run, so the repo never grows. The Streamlit app
# downloads it from raw.githubusercontent.com (see src/scout/remote_db.py).
#
# Each run restores the DB from the `data` branch, scrapes the buyer's areas (WEEKLY_AREAS,
# ~80 min; a manual run can name others), rescores the whole panel, and publishes the DB back.
# Listings from areas outside the list stay in the DB as price evidence for comparables.
# Collect is best-effort and time-boxed; rescore + publish run with `if: always()` so even a
# blocked scrape still ships whatever fresh data we got.
name: weekly-refresh
on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC = 07:00 Athens — weekly is enough for buying
  workflow_dispatch:       # manual "Run workflow" button
    inputs:
      areas:
        description: "Areas to scrape now, comma-separated (empty = the weekly list)"
        required: false
        default: ""
      pages_only:
        description: "Skip the scrape; only check new-build listing pages (finished or not?)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  WEEKLY_AREAS: >-
    Cholargos,Papagou,Agia Paraskevi,Chalandri,Vrilissia,Marousi,Zografou,Psychiko,
    Filothei,Irakleio,Nea Filadelfeia,Pefki,Galatsi,Ampelokipoi,Metamorfosi

concurrency:
  group: daily-refresh
  cancel-in-progress: false  # never cancel mid-publish; a second run queues instead

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 175     # above the sum of the step caps so publish is never cancelled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .

      - name: Restore DB from the data branch (first run starts empty)
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data; then
            git show FETCH_HEAD:listings.db > data/listings.db
            ls -l data/listings.db
          else
            echo "no data branch yet — starting with an empty DB"
          fi

      - name: Collect the weekly areas (best-effort, time-boxed)
        if: ${{ !inputs.pages_only }}
        # ~6 min per area at polite pacing; 15 areas ≈ 80 min. Public repo: free minutes.
        timeout-minutes: 110
        continue-on-error: true
        env:
          SCRAPE_DETAIL_PAGES: "false"
          SCRAPE_REQUEST_MIN_S: "4"
          SCRAPE_REQUEST_MAX_S: "7"
          # Plain-HTTP portals to read (docs/SOURCES.md). Golden Home verified on the runner
          # 2026-10-31 (run 41220363373); unknown names are ignored, never fatal.
          SOURCES: xe,greenacres,goldenhome
          AREAS: ${{ inputs.areas || env.WEEKLY_AREAS }}
        run: python scripts/run_daily.py --shards 5 --areas "$AREAS"

      - name: Check new-build listing pages (under construction?) — best-effort
        # Cards say "νεόδμητο 2025" even for shells sold off-plan; only the listing page says
        # "Υπό κατασκευή" / "παράδοση 2027". ~5 s a page; each listing is checked once (pages
        # checked before photo count + description were stored are re-read once, after).
        timeout-minutes: 40
        continue-on-error: true
        env:
          SCRAPE_REQUEST_MIN_S: "4"
          SCRAPE_REQUEST_MAX_S: "6"
        # `timeout` ends the script before the step cap: a step killed by the cap leaves its
        # python running, holding the SQLite lock, and the rescore after it then fails.
        run: >-
          timeout 36m python scripts/enrich_details.py --new-builds --limit 600
          --max-fetches 400 --no-rescore || true

      - name: Rescore whole panel from the DB (no network)
        if: always()
        timeout-minutes: 15
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); \
          from scout.db import init_db; init_db(); \
          from scout.config import load_strategy; from scout.pipeline import rescore_all; \
          print('rescored', rescore_all(load_strategy()), 'listings')"

      - name: Publish DB to the data branch (single commit, no history growth)
        if: always()
        run: |
          test -s data/listings.db || { echo "no DB to publish"; exit 0; }
          # fold the WAL into the main file so one file is the whole DB
          python -c "import sqlite3; c = sqlite3.connect('data/listings.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          rm -rf /tmp/pub && mkdir /tmp/pub && cp data/listings.db /tmp/pub/listings.db
          cd /tmp/pub
          git init -q -b data
          git config user.name "daily-refresh-bot"
          git config user.email "actions@github.com"
          git add listings.db
          git commit -q -m "data: daily refresh $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
