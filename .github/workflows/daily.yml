# Daily data refresh — the "cron" of the completely-free deployment.
#
# Data now lives in a free-tier Postgres (DATABASE_URL secret), not a committed SQLite
# file — the repo is public (for unlimited free Actions minutes), and a public repo
# cannot hold private data. Scrape + rescore write DIRECTLY to Postgres; there is no
# git-commit step anymore, which also removes the old "push rejected mid-run" class of
# bug entirely (nothing to push).
#
# Each run scrapes ONE rotating 1/5 slice of areas (full coverage every 5 days), then
# rescores the whole panel. Why a slice, not all 55 areas: a full two-portal sweep runs
# >5h — it can't finish inside a sane CI window.
name: daily-refresh
on:
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC = 07:00 Athens, before the workday
  workflow_dispatch: {}    # manual "Run workflow" button

concurrency:
  group: daily-refresh
  cancel-in-progress: true   # a manual run supersedes a scheduled one — never bill two at once

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[postgres]"

      - name: Collect today's area slice (best-effort, time-boxed)
        timeout-minutes: 25          # cap the ONE slow step; the job is never cancelled
        continue-on-error: true      # a block/timeout must not lose the rescore
        env:
          SCRAPE_DETAIL_PAGES: "false"
          SCRAPE_REQUEST_MIN_S: "4"
          SCRAPE_REQUEST_MAX_S: "7"
        run: python scripts/run_daily.py --shards 5

      - name: Rescore whole panel from the DB (no network)
        if: always()                 # runs even if collect was cut off — fresh medians/scores
        timeout-minutes: 15
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); \
          from scout.config import load_strategy; from scout.pipeline import rescore_all; \
          print('rescored', rescore_all(load_strategy()), 'listings')"
